<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./design/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main class="content" aria-labelledby="profile-name">
      <header class="header">
        <img
          src="./design/images/image-victor.jpg"
          alt="Victor Crest"
          width="106"
          height="106"
        />
      </header>
      <div class="middle-content">
        <div class="profile-identity">
          <h1 id="profile-name">Victor Crest</h1>
          <span class="age">26</span>
        </div>
        <p>London</p>
      </div>
      <ul class="bottom-content" role="list" aria-label="Profile statistics">
        <li class="item"><span>80K</span> Followers</li>
        <li class="item"><span>803K</span> Likes</li>
        <li class="item"><span>1.4K</span> Photos</li>
      </ul>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/pettik">Petr Bednarski</a>.
    </footer>
  </body>
</html>
